<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Benchmark IAS · accès protégé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
  :root { --dark:#2D5E4A; --sage:#5C9877; --light:#A6F781; --deep:#013220; --fluo:#6EFF29;
          --black:#000; --white:#fff; --grey:#EEEEEE; --axis:#595959; --grid:#D9D9D9; --no:#CC0000; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:"Outfit", "Futura", "Century Gothic", sans-serif; font-weight:300; color:var(--black); background:var(--white); }
  b, strong { font-weight:400; }
  h1, h2, h3 { text-transform:uppercase; font-weight:300; letter-spacing:.04em; margin:0; }
  button, input { font-family:inherit; font-weight:300; }

  #gate { min-height:100vh; background:var(--deep); color:var(--white); display:flex; align-items:center; justify-content:center; padding:24px; }
  #gate form { width:min(420px, 100%); }
  #gate h1 { font-size:30px; }
  #gate p { color:var(--light); font-size:15px; margin:10px 0 28px; }
  #gate .dot { display:inline-block; width:10px; height:10px; background:var(--fluo); margin-right:10px; }
  #gate input { width:100%; padding:14px 16px; font-size:16px; border:0; background:var(--white); color:var(--black); outline:none; }
  #gate input:focus { box-shadow:0 0 0 3px var(--fluo); }
  #gate button { margin-top:12px; width:100%; padding:13px; font-size:14px; letter-spacing:.1em; text-transform:uppercase; border:0; background:var(--fluo); color:var(--deep); cursor:pointer; }
  #gate button:disabled { opacity:.6; cursor:wait; }
  #gate .err { min-height:22px; margin-top:12px; font-size:14px; color:var(--white); }
  #gate .err.no::before { content:""; display:inline-block; width:10px; height:10px; background:var(--no); margin-right:8px; }

  .topbar { background:var(--black); color:var(--white); display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:12px 6vw; font-size:13px; }
  .btn { border:0; padding:9px 16px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
  .btn-up { background:var(--fluo); color:var(--deep); }
  .btn-reset { background:transparent; color:var(--white); border:1px solid var(--sage); }
  .topbar .st { color:var(--light); }
  .topbar .st.no { color:var(--white); }
  .topbar .st.no::before { content:""; display:inline-block; width:10px; height:10px; background:var(--no); margin-right:8px; }
  .topbar .priv { margin-left:auto; color:#9a9a9a; font-size:12px; }

  header { background:var(--deep); color:var(--white); padding:48px 6vw 40px; }
  header h1 { font-size:clamp(26px, 3.4vw, 44px); }
  header .sub { margin-top:10px; color:var(--light); font-size:15px; }
  header .dot { display:inline-block; width:10px; height:10px; background:var(--fluo); margin-right:10px; }
  nav { position:sticky; top:0; z-index:5; background:var(--dark); display:flex; flex-wrap:wrap; gap:4px 22px; padding:12px 6vw; }
  nav a { color:var(--white); text-decoration:none; text-transform:uppercase; font-size:12px; letter-spacing:.08em; }
  nav a:hover { color:var(--fluo); }
  main { padding:0 6vw 64px; }
  section { padding-top:48px; scroll-margin-top:40px; }
  section > h2 { font-size:22px; padding-bottom:10px; border-bottom:2px solid var(--dark); margin-bottom:20px; }
  section > h2::before { content:""; display:inline-block; width:12px; height:12px; background:var(--fluo); margin-right:12px; }
  h3 { font-size:15px; color:var(--dark); margin:26px 0 10px; }
  p, li { line-height:1.55; font-size:15px; }
  .alerts { background:var(--grey); padding:18px 24px 18px 40px; margin:28px 0 0; }
  .alerts li { margin:4px 0; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }
  .card { background:var(--dark); color:var(--white); padding:20px 22px; }
  .card-t { text-transform:uppercase; font-size:13px; letter-spacing:.08em; color:var(--light); }
  .card-v { font-size:46px; color:var(--fluo); margin:8px 0 4px; }
  .card-s { font-size:14px; }
  .card-m { font-size:12px; color:var(--light); margin-top:6px; }
  .tw { overflow-x:auto; margin:8px 0; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th { background:var(--sage); color:var(--white); font-weight:300; text-align:center; padding:9px 10px; white-space:nowrap; }
  td { padding:7px 10px; border-bottom:1px solid var(--grid); text-align:center; white-space:nowrap; }
  td:first-child { text-align:left; white-space:pre; }
  td.n { text-align:right; }
  td.up { background:var(--light); }
  td.nd { background:var(--grey); color:var(--axis); }
  tr.tot td, tr.ref td { background:var(--grey); }
  tr.tot td.up { background:var(--light); }
  tr.ref td { font-weight:400; }
  .legend { font-size:13px; color:var(--axis); margin:6px 0 0; }
  .legend i { display:inline-block; width:12px; height:12px; background:var(--light); vertical-align:-1px; margin-right:6px; }
  .chart { position:relative; height:340px; margin:18px 0 6px; }
  .note { background:var(--grey); padding:14px 18px; font-size:14px; margin:14px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width:900px) { .grid2 { grid-template-columns:1fr; } .topbar .priv { margin-left:0; } }
  footer { background:var(--black); color:var(--white); padding:22px 6vw; font-size:12px; }
  footer span { color:var(--fluo); }
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Benchmark IAS</h1>
    <p><span class="dot"></span>Accès protégé · Confidentiel</p>
    <input id="pwd" type="password" placeholder="Mot de passe" autofocus required>
    <button id="gateBtn" type="submit">Entrer</button>
    <div id="gateErr" class="err"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="topbar">
    <button class="btn btn-up" id="upBtn" type="button">Charger un export IAS (.xlsx)</button>
    <input id="file" type="file" accept=".xlsx,.xls" hidden>
    <button class="btn btn-reset" id="resetBtn" type="button" hidden>Revenir aux données d’origine</button>
    <span class="st" id="status"></span>
    <span class="priv">Le fichier est lu dans ton navigateur : rien n’est envoyé.</span>
  </div>
  <header>
    <h1>Benchmark IAS · vidéo France</h1>
    <div class="sub" id="sub"></div>
  </header>
  <nav>
    <a href="#synthese">Synthèse</a><a href="#classement">Classement BVOD &amp; SVOD</a><a href="#autres">Autres</a>
    <a href="#social">Social media</a><a href="#vis100">Focus TikTok &amp; Snap</a><a href="#fast">FAST</a><a href="#methode">Méthodologie</a>
  </nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script>
"use strict";

const COLS = ["p", "env", "fmt", "month", "t", "net", "mi", "vi", "q1", "q2", "q3", "q4", "vv", "mcm", "vcm"];
const NUM = COLS.slice(4);
const HEAD = {
  p: "Media Partner Media Partner Name",
  env: "Media Type New Environment Name",
  fmt: "Media Type New Format Name",
  month: "2) Performance Hit Month Month",
  t: "2) Performance Total Tracked Ads",
  net: "2) Performance Net Measured Ads",
  mi: "2) Performance Measured Impressions",
  vi: "2) Performance Viewable impressions",
  q1: "2) Performance Valid quartiles 1q",
  q2: "2) Performance Valid quartiles 2q",
  q3: "2) Performance Valid quartiles 3q",
  q4: "2) Performance Valid quartiles 4q",
  vv: "2) Performance Valid video ads",
  mcm: "2) Performance Measured Ads CM",
  vcm: "2) Performance Viewable Impressions CM",
};

const NETFLIX = "Netflix - Partner Measurement";
const DISNEY = "Disney (Sell)";
const SVOD = new Set([NETFLIX, "Amazon Media Group", DISNEY]);
const RMC = "RMC BFM Ads";
const BVOD = new Set(["TF1", "M6", "Canal Plus", "France TV", RMC]);
const YT = "Youtube - Partner Measurement";
const FACEBOOK = "Facebook - Partner Measurement";
const TIKTOK = "TikTok";
const SNAP = "Snap - Partner Measurement";
const EXCLUDED_SOCIAL = new Set([FACEBOOK, TIKTOK, SNAP, "Pinterest - Partner Measurement", "LinkedIn - Partner Measurement",
  "LinkedIn Corporation", "Reddit - Partner Measurement", "Be Real"]);
const SOCIAL_LINE = [
  [FACEBOOK, "Facebook"], [TIKTOK, "TikTok"], [SNAP, "Snapchat"], ["Pinterest - Partner Measurement", "Pinterest"],
  ["Reddit - Partner Measurement", "Reddit"], ["LinkedIn - Partner Measurement", "LinkedIn"], ["Spotify - Partner Measurement", "Spotify"],
];
const SOCIAL_NAMES = new Set(SOCIAL_LINE.map(x => x[0]));
const FAST_PLATFORMS = [["Pluto TV", "Paramount Streaming"], ["Samsung TV Plus", "Samsung"], ["Rakuten TV", "Rakuten (Sell)"], ["LG Channels", null]];
const MONTHS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const KPI6 = ["vis50", "vis100", "vcr25", "vcr50", "vcr75", "vcr100"];
const KPIS = ["imp_valid", ...KPI6];
const LABELS = { imp_valid: "% valides", vis50: "Vis. 50%/2s", vis100: "Vis. 100%/2s", vcr25: "Q 25%", vcr50: "Q 50%", vcr75: "Q 75%", vcr100: "Q 100%" };

// ------------------------------------------------------------------ data

const segmentOf = n => EXCLUDED_SOCIAL.has(n) ? "Social" : SVOD.has(n) ? "SVOD" : BVOD.has(n) ? "BVOD" : n === YT ? "YouTube" : "Autres";
const sum = (rows, k) => rows.reduce((a, r) => a + (r[k] == null ? 0 : r[k]), 0);
const rate = (n, d) => d ? n / d : null;
const qok = r => r.q1 != null && r.q2 != null && r.q3 != null && r.q4 != null;

function metrics(rows) {
  if (!rows.length) return { rows: 0, tracked: 0, valid: 0, imp_valid: null, ...Object.fromEntries(KPI6.map(k => [k, null])) };
  let den50 = 0;
  for (const r of rows) den50 += (r.p === DISNEY ? r.net : r.mi) ?? 0;
  const vcr = rows.filter(qok);
  const vvq = sum(vcr, "vv");
  const tracked = sum(rows, "t"), valid = sum(rows, "vv");
  return {
    rows: rows.length, tracked, valid,
    imp_valid: rate(valid, tracked),
    vis50: rate(sum(rows, "vi"), den50),
    vis100: rate(sum(rows, "vcm"), sum(rows, "mcm")),
    vcr25: rate(sum(vcr, "q1"), vvq), vcr50: rate(sum(vcr, "q2"), vvq),
    vcr75: rate(sum(vcr, "q3"), vvq), vcr100: rate(sum(vcr, "q4"), vvq),
  };
}

const scoreVs = (m, ref) => KPI6.filter(k => m[k] != null && ref[k] != null && m[k] > ref[k]).length;

function groupBy(rows, key) {
  const g = new Map();
  for (const r of rows) {
    const k = r[key];
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(r);
  }
  return g;
}

function load(raw) {
  const isTotal = r => r.p == null && r.fmt == null;
  const totals = raw.filter(isTotal);
  const work = raw.filter(r => !isTotal(r));
  const video = work.filter(r => r.fmt === "Video").map(r => {
    const o = { ...r, p: r.p ?? "(n/a)" };
    for (const k of NUM) if (o[k] != null) o[k] = Math.round(o[k]);
    o.seg = segmentOf(o.p);
    o.qok = qok(o);
    o.mono = o.qok && o.q1 >= o.q2 && o.q2 >= o.q3 && o.q3 >= o.q4;
    return o;
  });
  const display = work.filter(r => r.fmt === "Display");
  const social = r => r.seg === "Social";
  const kept = video.filter(r => !social(r) && r.mono);

  const monthly = new Map();
  for (const r of video) if (r.month) monthly.set(r.month, (monthly.get(r.month) || 0) + (r.t ?? 0));
  const months = [...monthly.keys()].sort();
  if (!months.length) throw new Error("Aucune ligne vidéo avec un mois dans ce fichier.");
  const vals = [...monthly.values()].sort((a, b) => a - b);
  const mid = vals.length >> 1;
  const median = vals.length % 2 ? vals[mid] : (vals[mid - 1] + vals[mid]) / 2;
  const partial = months.filter(m => monthly.get(m) < 0.6 * median);
  const [fy, fm] = months[0].split("-").map(Number);
  const [ly, lm] = months[months.length - 1].split("-").map(Number);
  const period = fy === ly ? `${MONTHS_FR[fm - 1]} – ${MONTHS_FR[lm - 1]} ${ly}` : `${MONTHS_FR[fm - 1]} ${fy} – ${MONTHS_FR[lm - 1]} ${ly}`;

  const dropped = video.filter(r => !social(r) && !r.mono);
  const excluded = [...groupBy(dropped, "p")].map(([p, rs]) => ({ p, rows: rs.length, tracked: sum(rs, "t") }))
    .sort((a, b) => b.tracked - a.tracked);
  const pick = f => video.filter(f);
  const S = {
    n_total_row: totals.length, tracked_total_row: sum(totals, "t"),
    n_video: video.length, tracked_video: sum(video, "t"),
    n_social: pick(social).length, tracked_social: sum(pick(social), "t"),
    n_null_q: pick(r => !social(r) && !r.qok).length, tracked_null_q: sum(pick(r => !social(r) && !r.qok), "t"),
    n_fail_mono: pick(r => !social(r) && r.qok && !r.mono).length, tracked_fail_mono: sum(pick(r => !social(r) && r.qok && !r.mono), "t"),
    n_kept: kept.length, tracked_kept: sum(kept, "t"),
    months, partial, period, excluded,
    netflix_tracked: sum(pick(r => r.p === NETFLIX), "t"),
    netflix_excluded: (excluded.find(e => e.p === NETFLIX) || { tracked: 0 }).tracked,
  };
  return { video, display, kept, S };
}

// ------------------------------------------------------------------ formatting

const esc = x => String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 1) => x == null ? "N/D" : (x * 100).toFixed(d).replace(".", ",") + " %";
const frInt = n => n == null ? "N/D" : Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const frBig = n => n == null ? "N/D" : n >= 1e9 ? (n / 1e9).toFixed(2).replace(".", ",") + " Md" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : frInt(n);
function pp(a, b) {
  if (a == null || b == null) return "N/D";
  const s = ((a - b) * 100).toFixed(1).replace(".", ",");
  return (s.startsWith("-") ? s : "+" + s) + " pp";
}

function cell(value, ref = null, cls = "") {
  if (value == null) return '<td class="nd">N/D</td>';
  const better = ref != null && value > ref + 1e-12;
  return `<td class="${better ? "up " : ""}${cls}">${pct(value)}</td>`;
}
const table = (head, rows) =>
  `<div class="tw"><table class="fw"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
const kpiRow = (label, m, ref, cls = "", extra = "") =>
  `<tr class="${cls}"><td>${esc(label)}</td><td class="n">${frBig(m.valid)}</td>${KPIS.map(k => cell(m[k], ref && k !== "imp_valid" ? ref[k] : null)).join("")}${extra}</tr>`;
const card = (title, value, sub, meta = "") =>
  `<div class="card"><div class="card-t">${esc(title)}</div><div class="card-v">${value}</div><div class="card-s">${esc(sub)}</div>${meta ? `<div class="card-m">${esc(meta)}</div>` : ""}</div>`;

// ------------------------------------------------------------------ page

let charts = [];

function render(data) {
  const raw = data.rows.map(a => Object.fromEntries(COLS.map((c, i) => [c, a[i]])));
  const { video, display, kept, S } = load(raw);
  const seg = s => kept.filter(r => r.seg === s);
  const yt = metrics(seg("YouTube"));
  const svod = metrics(seg("SVOD"));
  const bvodRows = kept.filter(r => r.seg === "BVOD" && r.p !== RMC);
  const bvod = metrics(bvodRows);
  const rmc = metrics(kept.filter(r => r.p === RMC));
  const podium = metrics([...bvodRows, ...seg("SVOD")]);
  const autres = metrics(seg("Autres"));
  const pm = new Map([...groupBy(kept, "p")].sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).map(([n, rs]) => [n, metrics(rs)]));
  const names = s => [...pm.keys()].filter(n => segmentOf(n) === s).sort((a, b) => pm.get(b).valid - pm.get(a).valid);

  const socialRows = video.filter(r => SOCIAL_NAMES.has(r.p));
  const social = metrics(socialRows);
  const parts = SOCIAL_LINE.filter(([n]) => video.some(r => r.p === n))
    .map(([n, lab]) => [lab, metrics(video.filter(r => r.p === n))])
    .sort((a, b) => b[1].valid - a[1].valid);
  const fbRows = video.filter(r => r.p === FACEBOOK);
  const noFb = metrics(socialRows.filter(r => r.p !== FACEBOOK));

  // synthèse
  const cards = [["BVOD + SVOD", podium, "hors RMC BFM Ads"], ["YouTube", yt, "référence"], ["Autres", autres, "hors social, SVOD, BVOD"]]
    .map(([n, m, sub]) => card(n, pct(m.vis50), `Vis. 50 %/2s · ${n === "YouTube" ? "Référence" : pp(m.vis50, yt.vis50) + " vs YouTube"}`, `${frBig(m.valid)} vidéos valides · ${sub}`)).join("");
  const segTable = table(["Segment", "Vidéos valides", ...KPIS.map(k => LABELS[k])], [
    kpiRow("BVOD + SVOD (hors RMC)", podium, yt, "tot"),
    kpiRow("    BVOD (hors RMC)", bvod, yt),
    kpiRow("    SVOD", svod, yt),
    kpiRow("YouTube", yt, null, "ref"),
    kpiRow("Autres", autres, yt, "tot"),
    kpiRow(`Social Media (${parts.length} réseaux)`, social, yt, "tot"),
  ]);

  // classement
  const rankHead = ["Media partner", "Vidéos valides", ...KPIS.map(k => LABELS[k]), "Score"];
  const ranking = list => list.slice()
    .sort((a, b) => {
      const A = pm.get(a), B = pm.get(b);
      return (scoreVs(B, yt) - scoreVs(A, yt)) || ((B.vcr100 || -1) - (A.vcr100 || -1)) || (B.valid - A.valid);
    })
    .map((n, i) => {
      const s = scoreVs(pm.get(n), yt);
      return kpiRow(`${i + 1}. ${n}`, pm.get(n), yt, "", `<td class="${s >= 5 ? "up" : ""}">${s}/6</td>`);
    });
  const autresTable = table(["Media partner", "Vidéos valides", ...KPIS.map(k => LABELS[k])],
    [kpiRow("Autres (total)", autres, yt, "tot"), ...names("Autres").slice(0, 15).map(n => kpiRow("    " + n, pm.get(n), yt))]);

  // social
  const socTable = table(["Réseau", "Vidéos valides", ...KPIS.map(k => LABELS[k])], [
    kpiRow("Social Media", social, yt, "tot"),
    ...parts.map(([lab, m]) => kpiRow("    " + lab, m, yt)),
    ...(fbRows.length ? [kpiRow("Social Media hors Facebook", noFb, yt, "tot")] : []),
    kpiRow("YouTube (référence)", yt, null, "ref"),
  ]);
  const fbNoQuartile = fbRows.length && !fbRows.some(qok);
  const socNote = ["Les lignes réseau détaillent le total : ne pas les additionner."];
  if (fbNoQuartile) socNote.push("Facebook ne remonte pas de quartiles : la complétion du total est calculée sans lui, alors que le % de valides et la visibilité l’incluent. La ligne « hors Facebook » est homogène sur toutes les colonnes.");
  if (!video.some(r => /twitter/i.test(r.p))) socNote.push("Twitter est absent de l’export.");

  // vis100 TikTok / Snap
  const v100 = rs => rate(sum(rs, "vcm"), sum(rs, "mcm"));
  const tt = video.filter(r => r.p === TIKTOK), sn = video.filter(r => r.p === SNAP), ytRows = seg("YouTube");
  const byMonth = rs => S.months.map(mo => { const v = v100(rs.filter(r => r.month === mo)); return v == null ? null : Math.round(v * 10000) / 100; });
  const noCm = SOCIAL_LINE.filter(([n]) => { const rs = video.filter(r => r.p === n); return sum(rs, "mcm") > 0 && sum(rs, "vcm") === 0; });
  const noCmNames = new Set(noCm.map(x => x[0]));
  const noCmLabel = noCm.map(x => x[1]).join(" et ");
  const ytV100 = v100(ytRows);
  const v100Cards = [
    ["TikTok", v100(tt)], ["Snapchat", v100(sn)],
    [noCm.length ? "Social hors " + noCmLabel : "Social media", v100(socialRows.filter(r => !noCmNames.has(r.p)))],
    ["YouTube", ytV100],
  ].map(([n, v]) => card(n, pct(v), `Vis. 100 %/2s · ${n === "YouTube" ? "Référence" : pp(v, ytV100) + " vs YouTube"}`)).join("");
  const ttsn = [...tt, ...sn];
  const inApp = rate(sum(ttsn.filter(r => r.env === "In-App"), "t"), sum(ttsn, "t"));
  const v100Note = ["Vis. 100 %/2s = Viewable Impressions CM ÷ Measured Ads CM : tous les pixels visibles pendant 2 secondes."];
  if (noCm.length) v100Note.push(`${noCmLabel} ne ${noCm.length > 1 ? "remontent" : "remonte"} aucune impression visible CM : ce 0 % n’est pas une vraie mesure, ${noCm.length > 1 ? "ils sont retirés" : "il est retiré"} du total social de la carte.`);
  if (inApp != null) v100Note.push(`${pct(inApp)} du volume TikTok et Snapchat est In-App, soit du feed mobile.`);

  // FAST
  const fastKpis = ["imp_valid", "vis50", "vis100", "vcr25", "vcr50", "vcr75", "vcr100"];
  const fastRows = FAST_PLATFORMS.map(([plat, ias]) => {
    const sv = ias ? video.filter(r => r.p === ias) : [];
    const sd = ias ? display.filter(r => r.p === ias) : [];
    const m = sum(sv, "t") > 1000 ? metrics(sv) : null;
    const status = !ias || (!sv.length && !sd.length) ? "Absent" : m ? "Vidéo" : "Display seulement";
    const vals = fastKpis.map(k => {
      const blank = m == null || (k === "vis50" && sum(sv, "mi") === 0) || (k === "vis100" && sum(sv, "mcm") === 0);
      return cell(blank ? null : m[k], k !== "imp_valid" ? yt[k] : null);
    }).join("");
    return `<tr><td>${esc(plat)}</td><td>${esc(ias || "—")}</td><td class="n">${frInt(sum(sv, "t"))}</td><td class="n">${frInt(sum(sd, "t"))}</td>${vals}<td>${esc(status)}</td></tr>`;
  });
  const fastTotal = FAST_PLATFORMS.reduce((a, [, ias]) => a + (ias ? sum(video.filter(r => r.p === ias), "t") : 0), 0);
  const fastShare = rate(fastTotal, S.tracked_video);

  // méthodologie
  const funnel = [
    ["Ligne de total de l’export", S.n_total_row, S.tracked_total_row],
    ["Vidéo uniquement (display et audio retirés)", S.n_video, S.tracked_video],
    ["Social exclu du benchmark", S.n_social, S.tracked_social],
    ["Quartiles manquants", S.n_null_q, S.tracked_null_q],
    ["Quartiles non décroissants (Q1 ≥ Q2 ≥ Q3 ≥ Q4)", S.n_fail_mono, S.tracked_fail_mono],
    ["Retenu dans le benchmark", S.n_kept, S.tracked_kept],
  ].map(([a, n, t], i, all) => `<tr class="${i === all.length - 1 ? "tot" : ""}"><td>${esc(a)}</td><td class="n">${frInt(n)}</td><td class="n">${frInt(t)}</td></tr>`);
  const exclRows = S.excluded.slice(0, 8).map(e => `<tr><td>${esc(e.p)}</td><td class="n">${e.rows}</td><td class="n">${frInt(e.tracked)}</td></tr>`);

  const alerts = [
    "La dimension device est absente de l’export : tous les taux sont en tous devices, sans split CTV / Desktop / Phone / Tablet.",
    "Pas de fichier IVT : la fraude n’est pas mesurée.",
    `Mois incomplets d’après les volumes : ${S.partial.join(", ") || "aucun"}.`,
  ];
  if (S.netflix_excluded > 0) alerts.push(`Netflix sort du benchmark : ${frInt(S.netflix_excluded)} impressions trackées sur ${frInt(S.netflix_tracked)} ont des quartiles non décroissants.`);
  if (rmc.rows) alerts.push(`RMC BFM Ads : ${pct(rmc.imp_valid)} d’impressions valides. Il est exclu du BVOD affiché.`);

  document.getElementById("sub").innerHTML = `<span class="dot"></span>${esc(S.period)} · tous devices · source IAS (${esc(data.source)})`;
  document.getElementById("foot").innerHTML = `<span>■</span> IAS · Benchmark vidéo · ${esc(S.period)} · Confidentiel`;
  document.title = `Benchmark IAS vidéo · ${S.period}`;
  document.getElementById("main").innerHTML = `
  <ul class="alerts">${alerts.map(a => `<li>${esc(a)}</li>`).join("")}</ul>

  <section id="synthese">
    <h2>Synthèse</h2>
    <div class="cards">${cards}</div>
    <h3>Tous les indicateurs par segment</h3>
    ${segTable}
    <p class="legend"><i></i>au-dessus de YouTube</p>
    <div class="chart"><canvas id="cSeg"></canvas></div>
  </section>

  <section id="classement">
    <h2>Classement BVOD &amp; SVOD</h2>
    <p>Score = nombre d’indicateurs sur 6 (visibilité 50 %, visibilité 100 %, quatre quartiles) strictement au-dessus de YouTube. Une ligne par media partner, tous devices.</p>
    <h3>BVOD</h3>${table(rankHead, ranking(names("BVOD")))}
    <h3>SVOD</h3>${table(rankHead, ranking(names("SVOD")))}
  </section>

  <section id="autres">
    <h2>Autres · 15 premiers media partners</h2>
    ${autresTable}
  </section>

  <section id="social">
    <h2>Social media · détail par réseau</h2>
    ${socTable}
    <div class="note">${esc(socNote.join(" "))}</div>
  </section>

  <section id="vis100">
    <h2>Focus visibilité 100 % / 2 s · TikTok &amp; Snapchat</h2>
    <div class="cards">${v100Cards}</div>
    <div class="chart"><canvas id="cV100"></canvas></div>
    <div class="note">${esc(v100Note.join(" "))}</div>
  </section>

  <section id="fast">
    <h2>FAST · Pluto TV, Samsung TV Plus, Rakuten TV, LG Channels</h2>
    ${table(["Plateforme", "Partner IAS", "Vidéo trackées", "Display trackées", ...fastKpis.map(k => LABELS[k]), "Statut"], fastRows)}
    <div class="note">Les plateformes FAST représentent ${frInt(fastTotal)} impressions vidéo trackées, soit ${pct(fastShare, 3)} de la vidéo de l’export. Elles sont surtout achetées en programmatique et rangées sous le DSP ou l’acheteur. Pour un vrai benchmark FAST, il faut un export IAS avec le device et le nom du placement ou de l’app.</div>
  </section>

  <section id="methode">
    <h2>Méthodologie</h2>
    <div class="grid2">
      <div>
        <h3>Formules</h3>
        <ul>
          <li>% valides = Valid video ads ÷ Total tracked ads</li>
          <li>Vis. 50 %/2s = Viewable impressions ÷ Measured impressions (Disney : ÷ Net Measured Ads)</li>
          <li>Vis. 100 %/2s = Viewable Impressions CM ÷ Measured Ads CM</li>
          <li>Quartile 25 / 50 / 75 / 100 % = Valid quartiles 1q / 2q / 3q / 4q ÷ Valid video ads</li>
          <li>Taux pondérés : somme des numérateurs ÷ somme des dénominateurs</li>
        </ul>
        <h3>Segments</h3>
        <ul>
          <li>SVOD : Amazon Media Group, Disney (Sell), Netflix</li>
          <li>BVOD : TF1, M6, Canal Plus, France TV (RMC BFM Ads à part)</li>
          <li>YouTube : référence</li>
          <li>Autres : tous les autres partners, hors social</li>
          <li>Social media : Facebook, TikTok, Snapchat, Pinterest, Reddit, LinkedIn, Spotify (sans filtre de quartiles)</li>
        </ul>
      </div>
      <div>
        <h3>Lignes retirées</h3>
        ${table(["Étape", "Lignes", "Impressions trackées"], funnel)}
        ${table(["Partner exclu (quartiles)", "Lignes", "Impressions trackées"], exclRows)}
      </div>
    </div>
  </section>`;

  drawCharts(
    { labels: KPI6.map(k => LABELS[k]), series: [["BVOD + SVOD", podium], ["YouTube", yt], ["Autres", autres]].map(([n, m]) => ({ name: n, data: KPI6.map(k => m[k] == null ? null : Math.round(m[k] * 1000) / 10) })) },
    { labels: S.months, series: [{ name: "TikTok", data: byMonth(tt) }, { name: "Snapchat", data: byMonth(sn) }, { name: "YouTube", data: byMonth(ytRows) }] },
  );
}

function drawCharts(seg, v) {
  charts.forEach(c => c.destroy());
  const C = ["#2D5E4A", "#5C9877", "#6EFF29"];
  Chart.defaults.font.family = "Outfit, sans-serif";
  Chart.defaults.font.weight = 300;
  Chart.defaults.color = "#595959";
  const axes = {
    x: { grid: { display: false }, ticks: { color: "#595959" } },
    y: { beginAtZero: true, grid: { color: "#D9D9D9" }, ticks: { color: "#595959", callback: x => x + " %" } },
  };
  const tip = { callbacks: { label: c => c.dataset.label + " : " + (c.raw === null ? "N/D" : c.raw.toLocaleString("fr-FR") + " %") } };
  const opts = { maintainAspectRatio: false, scales: axes, plugins: { legend: { position: "bottom" }, tooltip: tip } };
  charts = [
    new Chart(document.getElementById("cSeg"), {
      type: "bar",
      data: { labels: seg.labels, datasets: seg.series.map((s, i) => ({ label: s.name, data: s.data, backgroundColor: C[i] })) },
      options: opts,
    }),
    new Chart(document.getElementById("cV100"), {
      type: "line",
      data: { labels: v.labels, datasets: v.series.map((s, i) => ({ label: s.name, data: s.data, borderColor: C[i], backgroundColor: C[i], pointRadius: 3, tension: 0 })) },
      options: opts,
    }),
  ];
}

// ------------------------------------------------------------------ password gate

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(password) {
  const p = JSON.parse(document.getElementById("payload").textContent);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(p.salt), iterations: p.it, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.ct));
  const text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(text);
}

let original = null;

document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("gateBtn"), err = document.getElementById("gateErr");
  btn.disabled = true;
  err.className = "err";
  err.textContent = "Déchiffrement…";
  try {
    original = await decrypt(document.getElementById("pwd").value);
  } catch (_) {
    err.className = "err no";
    err.textContent = "Mot de passe incorrect.";
    btn.disabled = false;
    return;
  }
  document.getElementById("gate").remove();
  document.getElementById("app").hidden = false;
  render(original);
  setStatus(`Données d’origine · ${original.source}`);
});

// ------------------------------------------------------------------ upload

function setStatus(text, bad = false) {
  const st = document.getElementById("status");
  st.textContent = text;
  st.className = bad ? "st no" : "st";
}

function toMonth(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v * 86400000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
  }
  if (v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}`;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}`;
  return null;
}

function toNum(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  const n = Number(String(v).replace(/[\s\u00a0\u202f]/g, "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: "array" });
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null, blankrows: false });
  const h = aoa.findIndex(r => r.some(c => typeof c === "string" && c.trim() === HEAD.p));
  if (h < 0) throw new Error(`colonne « ${HEAD.p} » introuvable dans le premier onglet.`);
  const header = aoa[h].map(c => typeof c === "string" ? c.trim() : c);
  const idx = Object.fromEntries(COLS.map(c => [c, header.indexOf(HEAD[c])]));
  const missing = COLS.filter(c => idx[c] < 0).map(c => HEAD[c]);
  if (missing.length) throw new Error(`colonnes manquantes : ${missing.join(", ")}.`);
  return aoa.slice(h + 1).map(r => COLS.map(c => {
    const v = r[idx[c]];
    if (c === "month") return toMonth(v);
    if (NUM.includes(c)) return toNum(v);
    return v == null || v === "" ? null : String(v);
  }));
}

document.getElementById("upBtn").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (typeof XLSX === "undefined") return setStatus("Le lecteur Excel n’est pas encore chargé : réessaie dans quelques secondes.", true);
  setStatus(`Lecture de ${file.name}…`);
  try {
    const rows = parseWorkbook(await file.arrayBuffer());
    render({ source: file.name, rows });
    setStatus(`Fichier chargé · ${file.name} · ${frInt(rows.length)} lignes`);
    document.getElementById("resetBtn").hidden = false;
  } catch (err) {
    setStatus(`${file.name} : ${err.message} Les données affichées n’ont pas changé.`, true);
  }
});
document.getElementById("resetBtn").addEventListener("click", () => {
  render(original);
  setStatus(`Données d’origine · ${original.source}`);
  document.getElementById("resetBtn").hidden = true;
});
